# =============================================================================
# Pack Configuration for TypeScript Compilation
# =============================================================================

stages:
  - name: Compile TypeScript
    steps:
      - name: Compile TS to JS
        action: TypeScriptCompilerAction
        options:
          tsConfigPath: "./tsconfig.json"
          filePaths:
            - "src/index.ts"
            - "src/utils.ts"
          outputDir: "./dist"
          compilerOptions:
            target: "ES2020"
            module: "CommonJS"
