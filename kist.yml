# Points at the in-repo copy rather than https://www.getkist.com/schema.json so
# editor validation works on a checkout before the schema is published.
# yaml-language-server: $schema=./schema/kist.schema.json

---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development

    # Live reload configuration
    live:
        # enabled: true
        enabled: false
        port: 3000
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**

    logLevel: debug

    # Build caching configuration (new)
    cache:
        enabled: true
        cacheDir: ".kist-cache"
        # maxCacheSize: 1073741824  # 1GB
        # ttl: 604800000            # 7 days
        persistent: true

    # Performance tuning options (new)
    performance:
        maxConcurrentStages: 4
        maxConcurrentSteps: 8
        parallelProcessing: true
        streamingThreshold: 5242880  # 5MB
        showProgress: true

    # Error handling
    haltOnFailure: true


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Post-compile processing after tsc bootstrap"
        parallel: false  # Execute steps sequentially (default)

        steps:

            # Note: Directory cleaning handled by 'npm run clean' (prebuild)
            # TypeScript compilation handled by 'npm run build:bootstrap' (tsc)

            # Process Styles
            # -----------------------------------------------------------------
            # -   name: ProcessMainStyles
            #     action: StyleProcessingAction
            #     options:
            #         inputFile: "./src/scss/index.scss"
            #         outputFile: "./dist/styles/main.css"
            #         styleOption: "compressed"
            # -
            #     name: ProcessAdditionalStyles
            #     action: StyleProcessingAction
            #     options:
            #         inputFile: "./src/scss/index.scss"
            #         outputFile: "./dist/styles/additional.css"
            #         styleOption: "expanded"

            # Copy Files (using new batch copy with caching)
            # -----------------------------------------------------------------
            -
                name: CopyLICENSE
                action: FileCopyAction
                options:
                    srcFile: "./LICENSE"
                    destDir: "./dist"
                    useCache: true
            -
                name: CopyREADME
                action: FileCopyAction
                options:
                    srcFile: "./README.md"
                    destDir: "./dist"
                    useCache: true

            # Copy Dirs
            # -----------------------------------------------------------------
            # -
            #     name: CopySrcSCSS
            #     action: DirectoryCopyAction
            #     options:
            #         srcDir: "./src/scss"
            #         destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                # Declaring inputs opts this step into content-hash caching:
                # when nothing under src/ts has changed it is skipped and the
                # previous output is restored.
                inputs:
                    - "src/ts/**/*.ts"
                outputs:
                    - "dist/ts/**"
                options:
                    srcDir: "./src/ts"
                    destDir: "./dist/ts"

            # Compile TS to JS
            # -----------------------------------------------------------------

            # Note: TypeScript compilation handled by build:bootstrap step
            # kist uses itself after initial tsc bootstrap


            # Package.json
            # -----------------------------------------------------------------
            -
                name: Package.json
                action: PackageManagerAction
                options:
                    packageJsonPath: "./package.json"
                    outputDir: "./dist"
                    fields:
                        - name
                        - version
                        - bin
                        - dependencies
                        - description
                        - keywords
                        - license
                        - homepage
                        - repository
                        - bugs
                        - author
                        - contributors
                    customConfig:
                        # dist/package.json shadows the repository root for
                        # everything beneath dist/, so without this Node reads
                        # the ESM output in dist/js as CommonJS: it fails to
                        # parse, is retried as ESM, and every consumer gets a
                        # MODULE_TYPELESS_PACKAGE_JSON warning.
                        type: "module"
                        # Paths in this manifest are relative to dist/, so the
                        # root's "./dist/js/cli.js" would resolve to
                        # dist/dist/js/cli.js and the binary would not exist.
                        bin:
                            kist: "./js/cli.js"

            # Replace Version
            # -----------------------------------------------------------------
            -
                name: ReplaceVersion
                action: VersionWriteAction
                options:
                    files:
                    -   path: "./CITATION.cff"
                        key: "version: "
                    # VERSION holds a bare version and no prefix, so the key
                    # is empty. It was "v", which matched nothing — the step
                    # simply never updated this file.
                    -   path: "./VERSION"
                        key: ""
