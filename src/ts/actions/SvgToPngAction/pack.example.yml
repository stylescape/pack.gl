# =============================================================================
# Pack Configuration for SVG-to-PNG Conversion
# =============================================================================

stages:
  - name: Convert SVG to PNG
    steps:
      - name: Convert Logo
        action: SvgToPngAction
        options:
          svgContent: "<svg width='100' height='100'>...</svg>"
          outputPath: "dist/logo.png"
          width: 100
          height: 100
