name: Publish Package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'


jobs:


# =============================================================================
# Build
# =============================================================================

  build:

    name: Build

    runs-on: ubuntu-latest

    steps:

      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      -
        name: Upgrade npm
        run: |
          npm -v
          npm install -g npm@11.5.2 --force
          npm -v

      -
        name: NPM Install
        run: |
          npm install --legacy-peer-deps

      -
        name: Ensure dist directory exists
        run: mkdir -p dist

      -
        name: NPM Run Test
        run: |
          npm run test --if-present

      -
        name: NPM Run Build
        run: |
          npm run build --if-present

      -
        name: Zip dist & node_modules
        run: zip -9qry "build.zip" "./" -i "node_modules/*" -i "dist/*"

      -
        name: Upload build.zip
        uses: actions/upload-artifact@v7
        with:
          name: build.zip
          path: build.zip


# =============================================================================
# Publish to NPM
# =============================================================================

  publish-npm:

    name: Publish NPM

    needs: build

    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      -
        name: Checkout
        uses: actions/checkout@v7

      -
        name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: https://registry.npmjs.org/

      -
        name: Upgrade npm to 11.5.1+
        run: |
          npm -v
          npm install -g npm@11.5.2 --force
          npm -v

      -
        name: Download build.zip
        uses: actions/download-artifact@v7
        with:
          name: build.zip

      -
        name: Unzip build.zip
        run: unzip -q -o build.zip

      -
        name: Verify package.json before publish
        run: |
          cat dist/package.json | head -20
          echo "---"
          npm pkg get bin

      -
        name: Debug npm auth config
        run: |
          npm config get //registry.npmjs.org/:_authToken || true
          npm config get provenance || true
          npm -v

      -
        name: Fix bin path in dist package.json
        run: |
          cd dist
          npm pkg set bin="js/cli.js"

      -
        name: Publish NPM
        run: |
          cd dist
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ""


