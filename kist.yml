
---


# =============================================================================
# Options
# =============================================================================

options:

    mode: development

    # Live reload configuration
    live:
        # enabled: true
        enabled: false
        port: 3000
        root: public
        watchPaths:
            - src/**
            - config/**
        ignoredPaths:
            - node_modules/**

    logLevel: debug

    # Build caching configuration (new)
    cache:
        enabled: true
        cacheDir: ".kist-cache"
        # maxCacheSize: 1073741824  # 1GB
        # ttl: 604800000            # 7 days
        persistent: true

    # Performance tuning options (new)
    performance:
        maxConcurrentStages: 4
        maxConcurrentSteps: 8
        parallelProcessing: true
        streamingThreshold: 5242880  # 5MB
        showProgress: true

    # Error handling
    haltOnFailure: true


# =============================================================================
# Stages
# =============================================================================

stages:

    # Preprocessing
    # =========================================================================
    -
        name: Preprocessing
        description: "Post-compile processing after tsc bootstrap"
        parallel: false  # Execute steps sequentially (default)

        steps:

            # Note: Directory cleaning handled by 'npm run clean' (prebuild)
            # TypeScript compilation handled by 'npm run build:bootstrap' (tsc)

            # Process Styles
            # -----------------------------------------------------------------
            # -   name: ProcessMainStyles
            #     action: StyleProcessingAction
            #     options:
            #         inputFile: "./src/scss/index.scss"
            #         outputFile: "./dist/styles/main.css"
            #         styleOption: "compressed"
            # -
            #     name: ProcessAdditionalStyles
            #     action: StyleProcessingAction
            #     options:
            #         inputFile: "./src/scss/index.scss"
            #         outputFile: "./dist/styles/additional.css"
            #         styleOption: "expanded"

            # Copy Files (using new batch copy with caching)
            # -----------------------------------------------------------------
            -
                name: CopyLICENSE
                action: FileCopyAction
                options:
                    srcFile: "./LICENSE"
                    destDir: "./dist"
                    useCache: true
            -
                name: CopyREADME
                action: FileCopyAction
                options:
                    srcFile: "./README.md"
                    destDir: "./dist"
                    useCache: true

            # Copy Dirs
            # -----------------------------------------------------------------
            # -
            #     name: CopySrcSCSS
            #     action: DirectoryCopyAction
            #     options:
            #         srcDir: "./src/scss"
            #         destDir: "./dist/scss"
            -
                name: CopySrcTS
                action: DirectoryCopyAction
                options:
                    srcDir: "./src/ts"
                    destDir: "./dist/ts"

            # Compile TS to JS
            # -----------------------------------------------------------------

            # Note: TypeScript compilation handled by build:bootstrap step
            # kist uses itself after initial tsc bootstrap


            # Package.json
            # -----------------------------------------------------------------
            -
                name: Package.json
                action: PackageManagerAction
                options:
                    packageJsonPath: "./package.json"
                    outputDir: "./dist"
                    fields:
                        - name
                        - version
                        - bin
                        - dependencies
                        - description
                        - keywords
                        - license
                        - homepage
                    # customConfig:
                    #     private: true
                    #     scripts:
                    #     start: "node index.js"
                    #     build: "npm run build"
                    #     devDependencies:
                    #     typescript: "^5.0.0"

            # Replace Version
            # -----------------------------------------------------------------
            -
                name: ReplaceVersion
                action: VersionWriteAction
                options:
                    files:
                    -   path: "./CITATION.cff"
                        key: "version: "
                    -   path: "./VERSION"
                        key: "v"
